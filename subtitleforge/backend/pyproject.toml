[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subtitleforge-backend"
version = "1.0.0"
description = "Offline subtitle generation engine for SubtitleForge AI"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "faster-whisper>=1.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28", "ruff>=0.8"]

[project.scripts]
subtitleforge-backend = "subtitleforge.__main__:main"

[tool.setuptools.packages.find]
include = ["subtitleforge*"]

[tool.setuptools.package-data]
subtitleforge = ["db/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
